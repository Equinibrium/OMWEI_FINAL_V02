[package]
name = "sams-industrial-ecosystem"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
# Core OMWEI 32BSA Trust Hierarchy
omwei-atom = { workspace = true }

# SAMS Ecosystem Components
sams-logic-gate = { workspace = true }
sams-blackbox = { workspace = true }
sams-ghost-node = { workspace = true }
cyber-monitor = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
log = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

[features]
default = ["std"]
std = ["omwei-atom/std"]
serde = ["dep:serde", "dep:serde_json"]
pqc = ["omwei-atom/pqc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "verify_v02"
path = "examples/verify_v02.rs"
required-features = ["std", "tokio"]

[[example]]
name = "bench_trust"
path = "examples/bench_trust.rs"
required-features = ["std"]
