[package]
name = "omwei-hal"
version = "0.1.0"
edition = "2021"
authors = ["Equinibrium SoC Team"]
description = "Hardware Abstraction Layer for OMWEI Equinibrium RISC-V SoC"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
riscv = "0.11"
riscv-rt = "0.13"
embedded-hal = "1.0"
nb = "1.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[[bin]]
name = "omwei-hal"
test = false
bench = false

[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
linker = "rust-lld"
